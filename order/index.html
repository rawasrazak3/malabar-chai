<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order at your table · Malabar Chai Co.</title>
  <meta name="description" content="Order chai and Malabar snacks from your table at Malabar Chai Co., Vadakara. Sent straight to us on WhatsApp.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#8EAA69" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2A1B10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Manjari:wght@400;700&display=swap">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="order.css">
  <script type="module" src="order.js"></script>
</head>
<body class="order-page">
  <header class="o-head">
    <div class="o-head-row">
      <a class="top-logo" href="../"><span class="visually-hidden">Malabar Chai Co. home</span></a>
      <p class="status" data-status><span class="status-dot"></span><span class="status-text">&nbsp;</span></p>
    </div>
    <h1 class="o-table" data-table>Order</h1>
    <p class="o-lede">Add what you'd like, then send it to us on WhatsApp. We bring it to your table.</p>
  </header>

  <nav class="o-tabs" aria-label="Menu categories"><ul data-tabs></ul></nav>

  <main class="o-list" data-list></main>

  <div class="o-bar" data-bar>
    <span class="o-bar-glass" data-glass="bar" aria-hidden="true"></span>
    <span class="o-bar-sum" data-bar-sum aria-live="polite">Your glass is empty</span>
    <button class="btn btn-primary" type="button" data-review disabled>Review order</button>
  </div>

  <dialog class="sheet" id="cart" aria-labelledby="cart-title">
    <div class="sheet-head">
      <span class="sheet-grip" aria-hidden="true"></span>
      <h2 id="cart-title">Your order</h2>
      <button class="sheet-close" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <p class="o-closed" data-closed hidden></p>
      <ul class="o-cart" data-cart></ul>
      <label class="o-note">
        <span>Anything we should know?</span>
        <textarea data-note rows="2" maxlength="300" placeholder="Less sugar, no onion, bring it together…"></textarea>
      </label>
      <p class="o-total"><span>Total</span><span data-total>₹0</span></p>
    </div>
    <div class="sheet-foot">
      <a class="btn btn-primary btn-block" data-send href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wa"/></svg>Send order on WhatsApp
      </a>
      <p class="o-send-note">WhatsApp opens with your order filled in. Press send there.</p>
    </div>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.3Z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 12h12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 12h12M12 6v12"/></symbol>
  </svg>
</body>
</html>
